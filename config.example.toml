# Copy to ~/.config/ratatoskr/config.toml and fill in the three discord values.

[discord]
token = "BOT_TOKEN_FROM_DEVELOPER_PORTAL"
guild_id = 0    # right-click your server -> Copy Server ID (enable Developer Mode)
owner_id = 0    # right-click yourself   -> Copy User ID

[bridge]
category = "agents"        # Discord category the channels are created under
sync_agents = 30.0         # seconds between herdr agent list scans
poll_transcripts = 2.0     # seconds between transcript polls
exclude = []               # agent names to leave unbridged, e.g. ["main"]
